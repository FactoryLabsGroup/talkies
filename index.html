<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Talkies</title>
  <meta name="description" content="Meet a stranger. Earn your words. Start with GIFs only, then switch to text when you both want to.">
  <meta name="theme-color" content="#09090B">
  <meta name="color-scheme" content="dark">
  <meta property="og:title" content="Talkies">
  <meta property="og:description" content="Meet a stranger. Earn your words.">
  <meta property="og:url" content="https://factorylabs.app/talkies/">
  <meta property="og:type" content="website">
  <link rel="icon" href="favicon.svg?v=4" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Georgian:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css?v=11">
  <script type="module" src="app.js?v=11"></script>
</head>
<body data-screen="landing">
<div class="glow" aria-hidden="true"></div>

<header class="nav">
  <a class="brand" href="./" aria-label="Talkies">
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
      <defs><linearGradient id="mk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8B7CFF"/><stop offset="1" stop-color="#5B4BEA"/></linearGradient></defs>
      <path d="M8 4h16a5 5 0 0 1 5 5v11a5 5 0 0 1-5 5h-8.5L10 29.5V25H8a5 5 0 0 1-5-5V9a5 5 0 0 1 5-5z" fill="url(#mk)"/>
      <g fill="#fff"><circle cx="11" cy="14.5" r="1.7"/><circle cx="16" cy="14.5" r="1.7"/><circle cx="21" cy="14.5" r="1.7"/></g>
    </svg>
    <span>Talkies</span>
  </a>
  <div class="nav-right">
    <button id="langBtn" class="lang" type="button"></button>
  </div>
</header>

<main id="app">

  <!-- Landing -->
  <section id="landing" class="screen">
    <div class="hero">
      <div class="hero-copy">
        <h1 class="headline" data-i="tagline"></h1>
        <p class="lead" data-i="lead"></p>
        <div class="cta-row">
          <button id="findBtn" class="btn primary lg" type="button"><span data-i="find"></span><span class="ico" data-icon="arrow"></span></button>
          <button id="inviteFriendBtn" class="btn secondary lg" type="button"><span class="ico" data-icon="link"></span><span data-i="invite_btn"></span></button>
        </div>
        <p class="online"></p>
      </div>
      <div class="demo" aria-hidden="true">
        <div class="demo-head">
          <div class="demo-avas"><span class="ava" style="--hue: 195"></span><span class="ava" style="--hue: 300"></span></div>
          <div id="demoBar" class="demo-bar"><i></i><i></i></div>
        </div>
        <div id="demoFeed" class="demo-feed"></div>
      </div>
    </div>
  </section>

  <!-- Searching -->
  <section id="search" class="screen" hidden>
    <div class="center-card">
      <div class="radar"><span class="ico big-ico" data-icon="search"></span></div>
      <h2 class="h2" data-i="searching"></h2>
      <p class="online"></p>
      <div id="quiet" hidden>
        <p class="muted" data-i="quiet"></p>
        <button id="inviteBtn" class="btn secondary" type="button" data-i="invite"></button>
      </div>
      <button id="cancelBtn" class="btn ghost" type="button" data-i="cancel"></button>
    </div>
  </section>

  <!-- Invite: private link -->
  <section id="invite" class="screen" hidden>
    <div class="center-card invite-card">
      <div class="radar"><span class="ico big-ico" data-icon="link"></span></div>
      <h2 class="h2" data-i="invite_title"></h2>
      <p class="muted invite-sub" data-i="invite_sub"></p>
      <div class="link-box">
        <input id="inviteLink" class="link-input" type="text" readonly aria-label="Link">
        <button id="copyBtn" class="btn primary sm" type="button" data-i="copy"></button>
      </div>
      <button id="shareLinkBtn" class="btn secondary" type="button"><span class="ico" data-icon="share"></span><span data-i="share"></span></button>
      <p class="invite-wait"><span class="live-dot"></span><span data-i="invite_wait"></span></p>
      <button id="inviteCancel" class="btn ghost" type="button" data-i="cancel"></button>
    </div>
  </section>

  <!-- Join: opened someone's invite link -->
  <section id="join" class="screen" hidden>
    <div class="center-card">
      <div class="radar"><span>🤝</span></div>
      <h2 class="h2" data-i="joining"></h2>
      <p id="joinGone" class="muted" data-i="friend_gone" hidden></p>
      <button id="joinFind" class="btn primary" type="button" data-i="find" hidden></button>
      <button id="joinCancel" class="btn ghost" type="button" data-i="cancel"></button>
    </div>
  </section>

  <!-- Match -->
  <section id="match" class="screen" hidden>
    <div class="frame">
      <aside class="side">
        <div class="side-block stranger">
          <span class="ava lg"></span>
          <div class="stranger-info">
            <p class="label" data-i="stranger"></p>
            <p class="them-info"></p>
          </div>
        </div>
        <div class="side-block">
          <div class="row-between"><p id="textLabel" class="label"></p><p id="fuseSecs" class="fuse-secs"></p></div>
          <div class="fuse"><div class="fuse-fill"></div></div>
        </div>
        <ol id="ladder" class="ladder"></ol>
        <button class="btn secondary block next-btn" type="button"><span data-i="next_stranger"></span><span class="ico" data-icon="skip"></span></button>
      </aside>

      <div class="chat">
        <div class="chat-head">
          <div class="mobile-top">
            <div class="chip"><span class="ava"></span><span class="them-info"></span></div>
            <button class="btn secondary sm next-btn" type="button"><span data-i="next"></span><span class="ico" data-icon="skip"></span></button>
          </div>
          <div class="fuse mobile-only"><div class="fuse-fill"></div></div>
          <div class="stage-head">
            <div>
              <p id="stageTitle" class="stage-title"></p>
              <p id="meterText" class="hint"></p>
            </div>
          </div>
        </div>
        <div id="feed" class="feed" aria-live="polite"></div>
        <div class="composer">
          <div id="consent" class="consent" hidden></div>
          <div id="gifPanel" class="gif-panel">
            <div class="gif-top">
              <label class="gif-search-box"><span class="ico" data-icon="search"></span><input id="gifSearch" class="gif-search" type="search" autocomplete="off" enterkeyhint="search" data-ph="gif_search"></label>
            </div>
            <div id="gifChips" class="gif-chips"></div>
            <div id="gifGrid" class="gif-grid"></div>
            <p class="giphy">Powered by GIPHY</p>
          </div>
          <div id="tray" class="tray" hidden>
            <button id="gifBtn" class="gif-btn" type="button" aria-label="GIF" aria-expanded="false">GIF</button>
            <input id="textIn" class="text-in" type="text" autocomplete="off" enterkeyhint="send" maxlength="300" data-ph="free_ph">
            <button id="sendBtn" class="send" type="button" disabled aria-label="Send"><span class="ico" data-icon="send"></span></button>
          </div>
        </div>
      </div>
    </div>
    <div id="overlay" class="overlay" hidden></div>
    <div id="connecting" class="connecting"><div class="radar small"><span>👋</span></div><p data-i="connecting"></p></div>
  </section>

  <!-- End -->
  <section id="end" class="screen" hidden>
    <div class="end-wrap">
      <div id="postcard" class="postcard"></div>
      <div class="end-actions">
        <button id="againBtn" class="btn primary lg" type="button"><span data-i="next_stranger"></span><span class="ico" data-icon="arrow"></span></button>
        <button id="shareBtn" class="btn secondary lg" type="button" data-i="share"></button>
      </div>
    </div>
  </section>

</main>
<div id="confetti" class="confetti" aria-hidden="true"></div>
<div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
