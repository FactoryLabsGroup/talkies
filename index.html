<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Talkies</title>
  <meta name="description" content="Meet a stranger. Earn your words. Every chat starts as a silent film.">
  <meta name="theme-color" content="#F6F4F0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)">
  <meta property="og:title" content="Talkies">
  <meta property="og:description" content="Meet a stranger. Earn your words.">
  <meta property="og:url" content="https://factorylabs.app/talkies/">
  <meta property="og:type" content="website">
  <link rel="icon" href="favicon.svg?v=3" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=Noto+Sans+Georgian:wght@400;500;600&family=Noto+Serif+Georgian:wght@400;500&display=swap">
  <link rel="stylesheet" href="style.css?v=3">
  <script type="module" src="app.js?v=3"></script>
</head>
<body data-screen="landing">
<main id="app">

  <!-- Landing -->
  <section id="landing" class="screen">
    <div class="topline">
      <span class="brandmark">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M6 5h20a3 3 0 0 1 3 3v13a3 3 0 0 1-3 3H15l-6 4.5V24H6a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3z" fill="var(--ink)"/>
          <g fill="var(--bg)"><rect x="6.5" y="7.5" width="2.4" height="1.8" rx=".5"/><rect x="11.5" y="7.5" width="2.4" height="1.8" rx=".5"/><rect x="16.5" y="7.5" width="2.4" height="1.8" rx=".5"/><rect x="21.5" y="7.5" width="2.4" height="1.8" rx=".5"/>
          <rect x="6.5" y="19.7" width="2.4" height="1.8" rx=".5"/><rect x="11.5" y="19.7" width="2.4" height="1.8" rx=".5"/><rect x="16.5" y="19.7" width="2.4" height="1.8" rx=".5"/><rect x="21.5" y="19.7" width="2.4" height="1.8" rx=".5"/></g>
          <g fill="var(--accent)"><circle cx="11" cy="14.5" r="1.6"/><circle cx="16" cy="14.5" r="1.6"/><circle cx="21" cy="14.5" r="1.6"/></g>
        </svg>
      </span>
      <button id="langBtn" class="lang" type="button"></button>
    </div>
    <div class="hero">
      <p class="eyebrow">factorylabs</p>
      <h1 class="wordmark">Talkies</h1>
      <p class="tagline" data-i="tagline"></p>
      <p class="sub" data-i="sub"></p>
    </div>
    <div class="cta">
      <button id="findBtn" class="btn primary big" type="button" data-i="find"></button>
      <p class="online"></p>
    </div>
    <p class="foot" data-i="footer"></p>
  </section>

  <!-- Searching -->
  <section id="search" class="screen" hidden>
    <div class="searching">
      <div class="pulse"><span id="searchEmoji">😶</span></div>
      <p class="search-title" data-i="searching"></p>
      <p class="online"></p>
      <div id="quiet" hidden>
        <p class="muted" data-i="quiet"></p>
        <button id="inviteBtn" class="btn ghost" type="button" data-i="invite"></button>
      </div>
    </div>
    <button id="cancelBtn" class="link" type="button" data-i="cancel"></button>
  </section>

  <!-- Match -->
  <section id="match" class="screen" hidden>
    <header class="top">
      <div class="chip">
        <span id="ava" class="ava"></span>
        <span id="them" class="them"></span>
      </div>
      <button id="nextBtn" class="next" type="button"><span data-i="next"></span><span aria-hidden="true">→</span></button>
    </header>
    <div id="fuse" class="fuse" role="progressbar" aria-valuemin="0" aria-valuemax="90">
      <div id="fuseFill" class="fuse-fill"></div>
      <span id="fuseSpark" class="fuse-spark"></span>
    </div>
    <div class="progress">
      <div class="progress-labels"><span id="stageName" class="stage-name"></span><span id="stageNext" class="stage-next"></span></div>
      <div id="ladder" class="ladder"></div>
    </div>
    <div id="feed" class="feed" aria-live="polite"></div>
    <div class="dock">
      <p id="meterText" class="hint"></p>
      <div id="consent" class="consent" hidden></div>
      <div id="tray" class="tray">
        <div id="tokens" class="tokens"></div>
        <input id="textIn" class="text-in" type="text" autocomplete="off" enterkeyhint="send" hidden>
        <button id="sendBtn" class="send" type="button" disabled aria-label="Send">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <nav id="tabs" class="tabs"></nav>
      <div id="panel" class="panel"></div>
    </div>
    <div id="overlay" class="overlay" hidden></div>
    <div id="connecting" class="connecting"><div class="pulse small"><span>👋</span></div><p data-i="connecting"></p></div>
  </section>

  <!-- Postcard -->
  <section id="end" class="screen" hidden>
    <div id="postcard" class="postcard"></div>
    <div class="end-actions">
      <button id="againBtn" class="btn primary big" type="button" data-i="next_stranger"></button>
      <button id="shareBtn" class="btn ghost" type="button" data-i="share"></button>
    </div>
  </section>

</main>
<div id="confetti" class="confetti" aria-hidden="true"></div>
<div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
