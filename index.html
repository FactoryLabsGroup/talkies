<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Talkies</title>
  <meta name="description" content="Meet a stranger. Earn your words. Start with emoji, unlock phrases, GIFs and free chat by taking turns.">
  <meta name="theme-color" content="#FAFAFB" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0B0B0F" media="(prefers-color-scheme: dark)">
  <meta property="og:title" content="Talkies">
  <meta property="og:description" content="Meet a stranger. Earn your words.">
  <meta property="og:url" content="https://factorylabs.app/talkies/">
  <meta property="og:type" content="website">
  <link rel="icon" href="favicon.svg?v=4" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Georgian:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css?v=4">
  <script type="module" src="app.js?v=4"></script>
</head>
<body data-screen="landing">
<div class="glow" aria-hidden="true"></div>

<header class="nav">
  <a class="brand" href="./" aria-label="Talkies">
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
      <defs><linearGradient id="mk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8B7CFF"/><stop offset="1" stop-color="#5B4BEA"/></linearGradient></defs>
      <path d="M8 4h16a5 5 0 0 1 5 5v11a5 5 0 0 1-5 5h-8.5L10 29.5V25H8a5 5 0 0 1-5-5V9a5 5 0 0 1 5-5z" fill="url(#mk)"/>
      <g fill="#fff"><circle cx="11" cy="14.5" r="1.7"/><circle cx="16" cy="14.5" r="1.7"/><circle cx="21" cy="14.5" r="1.7"/></g>
    </svg>
    <span>Talkies</span>
  </a>
  <div class="nav-right">
    <span class="online"></span>
    <button id="langBtn" class="lang" type="button"></button>
  </div>
</header>

<main id="app">

  <!-- Landing -->
  <section id="landing" class="screen">
    <div class="hero">
      <p class="pill"><span class="pill-dot"></span><span data-i="pill"></span></p>
      <h1 class="headline" data-i="tagline"></h1>
      <p class="lead" data-i="lead"></p>
      <div class="cta-row">
        <button id="findBtn" class="btn primary lg" type="button"><span data-i="find"></span><span class="ico" data-icon="arrow"></span></button>
      </div>
      <p class="fine" data-i="footer"></p>
    </div>
    <div class="how">
      <p class="how-title" data-i="how_title"></p>
      <ol id="steps" class="steps"></ol>
    </div>
  </section>

  <!-- Searching -->
  <section id="search" class="screen" hidden>
    <div class="center-card">
      <div class="radar"><span id="searchEmoji">😶</span></div>
      <h2 class="h2" data-i="searching"></h2>
      <p class="online"></p>
      <div id="quiet" hidden>
        <p class="muted" data-i="quiet"></p>
        <button id="inviteBtn" class="btn secondary" type="button" data-i="invite"></button>
      </div>
      <button id="cancelBtn" class="btn ghost" type="button" data-i="cancel"></button>
    </div>
  </section>

  <!-- Match -->
  <section id="match" class="screen" hidden>
    <div class="frame">
      <aside class="side">
        <div class="side-block stranger">
          <span class="ava lg"></span>
          <div class="stranger-info">
            <p class="label" data-i="stranger"></p>
            <p class="them-info"></p>
          </div>
        </div>
        <div class="side-block">
          <div class="row-between"><p class="label" data-i="time_left"></p><p id="fuseSecs" class="fuse-secs"></p></div>
          <div class="fuse"><div class="fuse-fill"></div></div>
        </div>
        <ol id="ladder" class="ladder"></ol>
        <button class="btn secondary block next-btn" type="button"><span data-i="next_stranger"></span><span class="ico" data-icon="skip"></span></button>
      </aside>

      <div class="chat">
        <div class="chat-head">
          <div class="mobile-top">
            <div class="chip"><span class="ava"></span><span class="them-info"></span></div>
            <button class="btn secondary sm next-btn" type="button"><span data-i="next"></span><span class="ico" data-icon="skip"></span></button>
          </div>
          <div class="fuse mobile-only"><div class="fuse-fill"></div></div>
          <div class="stage-head">
            <div>
              <p id="stageTitle" class="stage-title"></p>
              <p id="meterText" class="hint"></p>
            </div>
            <div id="ladderMini" class="ladder-mini"></div>
          </div>
        </div>
        <div id="feed" class="feed" aria-live="polite"></div>
        <div class="composer">
          <div id="consent" class="consent" hidden></div>
          <div id="tray" class="tray">
            <div id="tokens" class="tokens"></div>
            <input id="textIn" class="text-in" type="text" autocomplete="off" enterkeyhint="send" hidden>
            <button id="sendBtn" class="send" type="button" disabled aria-label="Send"><span class="ico" data-icon="send"></span></button>
          </div>
          <nav id="tabs" class="tabs"></nav>
          <div id="panel" class="panel"></div>
        </div>
      </div>
    </div>
    <div id="overlay" class="overlay" hidden></div>
    <div id="connecting" class="connecting"><div class="radar small"><span>👋</span></div><p data-i="connecting"></p></div>
  </section>

  <!-- End -->
  <section id="end" class="screen" hidden>
    <div class="end-wrap">
      <div id="postcard" class="postcard"></div>
      <div class="end-actions">
        <button id="againBtn" class="btn primary lg" type="button"><span data-i="next_stranger"></span><span class="ico" data-icon="arrow"></span></button>
        <button id="shareBtn" class="btn secondary lg" type="button" data-i="share"></button>
      </div>
    </div>
  </section>

</main>
<div id="confetti" class="confetti" aria-hidden="true"></div>
<div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
